[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# EVM version supported by GIWA (OP Stack, Cancun-compatible).
evm_version = "cancun"

[rpc_endpoints]
giwa_sepolia = "https://sepolia-rpc.giwa.io"
# Ethereum Sepolia — override with a keyed RPC via SEPOLIA_RPC_URL if the public node rate-limits.
sepolia = "${SEPOLIA_RPC_URL}"

# GIWA Sepolia uses a Blockscout explorer; verification is optional for the demo.
[etherscan]
giwa_sepolia = { key = "unused", url = "https://sepolia-explorer.giwa.io/api", chain = 91342 }
