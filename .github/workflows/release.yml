# Release / CD — builds the API image, publishes it to GHCR, signs it with
# keyless cosign, then (only when a cluster is actually wired) rolls it out.
#
# HONESTY: the build + push + sign steps are real and run on GitHub's runners.
# The deploy job is GATED on `vars.DEPLOY_STAGING == 'true'` and a configured
# `staging` Environment (KUBE_CONFIG secret + reviewers). Until those exist it is
# SKIPPED — never a fake "deployed ✓". Wire the cluster, flip the var, and the same
# pipeline promotes the signed digest with zero code changes.
name: Release

on:
  push:
    branches: [main] # → staging
    tags: ['v*.*.*'] # → prod (a cut release)
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abort a half-finished rollout

env:
  IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  image:
    name: Build, push & sign image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless (OIDC)
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      # Re-run the full topological build as a hard gate BEFORE spending time on the
      # image — a build break should fail here, not four layers into `docker build`.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build gate
        run: pnpm -r build

      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the image by digest (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

  deploy-staging:
    name: Deploy to staging
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING == 'true'
    runs-on: ubuntu-latest
    environment: staging # approvals + KUBE_CONFIG secret live here
    steps:
      - uses: actions/checkout@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Load kubeconfig
        run: |
          install -d -m 700 "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Apply manifests, roll out the signed digest, wait
        run: |
          # `-k` renders via kubectl's bundled kustomize (ensures ns/service/deploy exist),
          # then pin the exact cosign-signed digest — a rollout the cluster can verify.
          kubectl apply -k infra/k8s/base
          kubectl -n intent-wallet set image deployment/api \
            api=${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          kubectl -n intent-wallet rollout status deployment/api --timeout=180s
